# config.yaml — canonical config, history in git, no version suffix
#
# This is the *only* config file. When you change it, commit. When you need
# a previous version, use `git log -p config.yaml` or `git show <sha>:config.yaml`.
# Don't create config_v2.yaml — see ../README.md for why.

app:
  name: example-service
  port: 8080
  environment: production

logging:
  level: info
  format: json

database:
  host: db.internal
  port: 5432
  pool_size: 20
