name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MySolution.sln

      - name: Build
        run: dotnet build MySolution.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MySolution.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Format check
        run: dotnet format --verify-no-changes MySolution.sln
