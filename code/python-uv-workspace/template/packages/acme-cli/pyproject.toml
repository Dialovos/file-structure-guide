[project]
name = "acme-cli"
version = "0.1.0"
description = "Command-line interface"
requires-python = ">=3.12"
dependencies = ["acme-core"]

[project.scripts]
acme = "acme_cli:main"

[tool.uv.sources]
acme-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_cli"]
