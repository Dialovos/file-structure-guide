[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-project"
version = "0.0.1"
description = "A notebooks-first research project."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "jupyter>=1.0",
]

[project.optional-dependencies]
dev = [
    "nbstripout>=0.6",
    "jupytext>=1.16",
]

# `src/` is treated as a top-level importable package called `src`.
# After `pip install -e .` notebooks can do
# `from src.utils import project_root`. Rename the directory (and
# this entry) to your project's package name once you outgrow the
# starter.
[tool.hatch.build.targets.wheel]
packages = ["src"]
