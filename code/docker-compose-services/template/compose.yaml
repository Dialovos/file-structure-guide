services:
  web:
    build: ./services/web
    environment:
      APP_MESSAGE: ${APP_MESSAGE:-hello from compose}
      REDIS_HOST: redis
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
